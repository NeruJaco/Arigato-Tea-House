<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <!--
    =====================================================
    META VIEWPORT: Esencial para que se vea bien en
    teléfonos. Sin esto, el menú se vería tiny en móvil.
    =====================================================
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Menú digital de Arigato Tea House — matcha, té, onigiri y postres japoneses." />
  <title>Menú · (おちゃじかん)</title>

  <!--
    =====================================================
    FUENTES LOCALES (no requieren internet)
    Extraídas de fonts/ para funcionar offline.
    Usamos solo los pesos necesarios para no cargar
    archivos innecesarios (Variable Fonts = un solo .ttf
    que soporta todos los pesos).
    =====================================================
  -->
  <style>
    /* DM Serif Display — para títulos y precios */
    @font-face {
      font-family: 'DM Serif Display';
      src: url('fonts/DM_Serif_Display/DMSerifDisplay-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'DM Serif Display';
      src: url('fonts/DM_Serif_Display/DMSerifDisplay-Italic.ttf') format('truetype');
      font-weight: 400;
      font-style: italic;
      font-display: swap;
    }
    /* Jost — para cuerpo de texto (Variable Font: soporta 300–900) */
    @font-face {
      font-family: 'Jost';
      src: url('fonts/Jost/Jost-VariableFont_wght.ttf') format('truetype');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Jost';
      src: url('fonts/Jost/Jost-Italic-VariableFont_wght.ttf') format('truetype');
      font-weight: 100 900;
      font-style: italic;
      font-display: swap;
    }
    /* Noto Serif JP — para texto japonés y logotipo (Variable Font) */
    @font-face {
      font-family: 'Noto Serif JP';
      src: url('fonts/Noto_Serif_JP/NotoSerifJP-VariableFont_wght.ttf') format('truetype');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }
  </style>

  <style>
    /*
      =====================================================
      VARIABLES CSS: Son como "constantes" de diseño.
      Si quieres cambiar un color o fuente en todo el
      sitio, solo cambias aquí y se aplica en todos lados.
      =====================================================
    */
    :root {
      --color-crema:     #f7f3ee;   /* Fondo principal, como papel washi */
      --color-madera:    #c8a97e;   /* Acento madera natural del local */
      --color-matcha:    #5a7a4a;   /* Verde matcha para destacar */
      --color-carbon:    #1e1e1e;   /* Texto principal oscuro */
      --color-gris:      #8a8a8a;   /* Texto secundario / precios */
      --color-borde:     #e0d9d0;   /* Líneas divisoras sutiles */
      --fuente-titulo:   'DM Serif Display', 'Noto Serif JP', serif;
      --fuente-cuerpo:   'Jost', 'Noto Serif JP', sans-serif;
    }

    /*
      =====================================================
      RESET BÁSICO: Elimina márgenes y paddings por
      defecto del navegador para empezar desde cero.
      box-sizing: border-box hace que el ancho incluya
      padding y borde (más intuitivo para maquetar).
      =====================================================
    */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--color-crema);
      color: var(--color-carbon);
      font-family: var(--fuente-cuerpo);
      font-weight: 300;
      min-height: 100vh;
      /* Textura de papel muy sutil usando un gradiente radial */
      background-image: radial-gradient(ellipse at 20% 50%, rgba(200,169,126,0.06) 0%, transparent 60%),
                        radial-gradient(ellipse at 80% 20%, rgba(90,122,74,0.05) 0%, transparent 50%);
    }

    /* ==================== PANTALLA DE BIENVENIDA ==================== */
    /*
      Esta sección es la primera que ve el cliente.
      Ocupa toda la pantalla (100vh = 100% del alto visible).
      Se oculta cuando el usuario elige su idioma.
    */
    #pantalla-idioma {
      position: fixed;         /* Fija en pantalla, encima de todo */
      inset: 0;                /* Abarca todo: top, right, bottom, left = 0 */
      background: var(--color-crema);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;            /* Número alto = encima de otros elementos */
      gap: 3rem;
      padding: 2rem;
      /* Animación de entrada: aparece desde abajo suavemente */
      animation: fadeUp 0.8s ease both;
    }

    /* Cuando JavaScript agrega la clase "oculto", la pantalla desaparece */
    #pantalla-idioma.oculto {
      animation: fadeOut 0.5s ease forwards;
      pointer-events: none;    /* Ya no responde a clicks mientras desaparece */
    }

    .bienvenida-logo {
      text-align: center;
    }

    .bienvenida-subtitulo {
      font-family: var(--fuente-titulo);
      font-size: clamp(0.85rem, 2.5vw, 1.1rem);
      color: var(--color-gris);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      margin-top: 0.5rem;
    }

    /* Línea decorativa de matcha */
    .linea-matcha {
      width: 40px;
      height: 2px;
      background: var(--color-matcha);
      margin: 1rem auto 0;
      border-radius: 2px;
    }

    /* Instrucción de selección de idioma */
    .bienvenida-pregunta {
      font-size: clamp(0.8rem, 2vw, 0.95rem);
      color: var(--color-gris);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      text-align: center;
    }

    /* Contenedor de los botones de idioma */
    .botones-idioma {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
      max-width: 320px;
    }

    /*
      =====================================================
      BOTONES DE SELECCIÓN DE IDIOMA
      Cada botón llama a la función elegirIdioma() en JS
      =====================================================
    */
    .btn-idioma {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.1rem 1.6rem;
      background: white;
      border: 1.5px solid var(--color-borde);
      border-radius: 4px;
      cursor: pointer;         /* El cursor se vuelve mano al pasar encima */
      font-family: var(--fuente-cuerpo);
      font-size: 1rem;
      color: var(--color-carbon);
      transition: all 0.25s ease;  /* Transición suave en hover */
      text-align: left;
      width: 100%;
    }

    .btn-idioma:hover {
      border-color: var(--color-matcha);
      background: rgba(90,122,74,0.04);
      transform: translateX(4px);   /* Se mueve ligeramente a la derecha */
    }

    .btn-idioma .bandera {
      font-size: 1.4rem;
    }

    .btn-idioma .nombre-idioma {
      flex: 1;
      padding: 0 1rem;
      font-weight: 400;
    }

    .btn-idioma .nombre-nativo {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.1rem;
      text-align: right;
    }

    .btn-idioma .nombre-nativo .nativo-romanji {
      color: var(--color-gris);
      font-size: 0.78rem;
    }

    .btn-idioma .nombre-nativo .nativo-kanji {
      font-family: 'Noto Serif JP', serif;
      color: var(--color-gris);
      font-size: 0.72rem;
      font-weight: 300;
      opacity: 0.7;
    }

    /* ==================== CONTENIDO DEL MENÚ ==================== */
    /*
      Todo el menú está oculto por defecto (display:none).
      JavaScript lo muestra cuando el usuario elige idioma.
    */
    #contenido-menu {
      display: none;
      max-width: 720px;
      margin: 0 auto;
      padding: 0 1.5rem 4rem;
    }

    #contenido-menu.visible {
      display: block;
      animation: fadeUp 0.6s ease both;
    }

    /* ==================== CABECERA DEL MENÚ ==================== */
    .menu-header {
      padding: 3rem 0 2rem;
      text-align: center;
      position: relative;
    }

    .menu-logo-texto {
      font-family: 'Noto Serif JP', serif;
      font-size: clamp(1.8rem, 5vw, 2.8rem);
      font-weight: 300;
      letter-spacing: 0.05em;
      color: var(--color-carbon);
    }

    .menu-subtitulo {
      font-size: 0.75rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--color-gris);
      margin-top: 0.4rem;
    }

    /* Botón pequeño para cambiar idioma desde el menú */
    .btn-cambiar-idioma {
      position: absolute;
      top: 3rem;
      right: 0;
      background: none;
      border: 1px solid var(--color-borde);
      border-radius: 3px;
      padding: 0.4rem 0.8rem;
      font-family: var(--fuente-cuerpo);
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--color-gris);
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-cambiar-idioma:hover {
      border-color: var(--color-matcha);
      color: var(--color-matcha);
    }

    /* Separador decorativo de matcha en el header */
    .separador-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 1.5rem 0;
    }

    .separador-header::before,
    .separador-header::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--color-borde);
    }

    .separador-icono {
      color: var(--color-matcha);
      font-size: 1rem;
    }

    /* ==================== SECCIONES DEL MENÚ ==================== */
    .seccion-menu {
      margin-bottom: 3rem;
    }

    .seccion-titulo {
      font-family: var(--fuente-titulo);
      font-size: 0.7rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--color-matcha);
      margin-bottom: 0.5rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--color-borde);
    }

    /* Descripción de la sección */
    .seccion-descripcion {
      font-size: 0.78rem;
      color: var(--color-gris);
      margin-bottom: 1.2rem;
      line-height: 1.6;
    }

    /* Sub-encabezado dentro de sección (ej: Matcha / Hojicha) */
    .subseccion-titulo {
      font-family: var(--fuente-titulo);
      font-size: 0.8rem;
      letter-spacing: 0.2em;
      color: var(--color-carbon);
      margin: 1.5rem 0 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .subseccion-titulo::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--color-borde);
      opacity: 0.6;
    }

    .subseccion-desc {
      font-size: 0.75rem;
      color: var(--color-gris);
      line-height: 1.5;
      margin-bottom: 0.8rem;
    }

    /* ==================== ITEMS DEL MENÚ ==================== */
    .item-menu {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 0.85rem 0;
      border-bottom: 1px solid rgba(224,217,208,0.5);
      gap: 1rem;
    }

    .item-menu:last-child {
      border-bottom: none;
    }

    .item-info {
      flex: 1;
    }

    .item-nombre {
      font-size: 0.95rem;
      font-weight: 400;
      color: var(--color-carbon);
      margin-bottom: 0.2rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    .item-descripcion {
      font-size: 0.78rem;
      color: var(--color-gris);
      margin-top: 0.25rem;
      line-height: 1.5;
    }

    /* Precio alineado a la derecha */
    .item-precio {
      font-family: var(--fuente-titulo);
      font-size: 0.9rem;
      color: var(--color-madera);
      white-space: nowrap;     /* El precio nunca se parte en dos líneas */
      font-weight: 400;
      text-align: right;
      flex-shrink: 0;
    }

    /* ==================== PRECIOS DE ONIGIRI (tabla) ==================== */
    /*
      Los onigiri tienen 3 variantes de arroz, por lo que
      mostramos las 3 columnas de precio juntas.
    */
    .onigiri-precios {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      justify-content: flex-end;
      flex-shrink: 0;
    }

    .onigiri-precio-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.1rem;
      min-width: 52px;
    }

    .onigiri-precio-label {
      font-size: 0.55rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--color-gris);
    }

    .onigiri-precio-val {
      font-family: var(--fuente-titulo);
      font-size: 0.82rem;
      color: var(--color-madera);
    }

    .onigiri-precio-val.na {
      color: var(--color-borde);
      font-size: 0.8rem;
    }

    /* Encabezado de columnas para la sección onigiri */
    .onigiri-cols-header {
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
      padding: 0.3rem 0;
      margin-bottom: 0.3rem;
      border-bottom: 1px dashed var(--color-borde);
    }

    .onigiri-col-label {
      min-width: 52px;
      text-align: center;
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--color-matcha);
    }

    /* ==================== LATTES: PRECIOS HOT/COLD ==================== */
    .latte-precios {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.15rem;
      flex-shrink: 0;
    }

    .latte-precio-fila {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .latte-precio-label {
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--color-gris);
    }

    .latte-precio-val {
      font-family: var(--fuente-titulo);
      font-size: 0.88rem;
      color: var(--color-madera);
    }

    /* ==================== BOWL SETS ==================== */
    .bowl-item {
      padding: 1rem 0;
      border-bottom: 1px solid rgba(224,217,208,0.5);
    }

    .bowl-item:last-child {
      border-bottom: none;
    }

    .bowl-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 1rem;
      margin-bottom: 0.35rem;
    }

    .bowl-incluye {
      font-size: 0.72rem;
      color: var(--color-gris);
      margin-top: 0.4rem;
      padding-left: 0.8rem;
      border-left: 2px solid var(--color-borde);
      line-height: 1.8;
    }

    .bowl-nota {
      font-size: 0.7rem;
      color: var(--color-matcha);
      margin-top: 0.3rem;
      font-style: italic;
    }

    /* ==================== INFUSIONES: INGREDIENTES ==================== */
    .infusion-ingredientes {
      font-size: 0.72rem;
      color: var(--color-matcha);
      margin-top: 0.15rem;
      letter-spacing: 0.05em;
    }

    /* ==================== BADGES / ETIQUETAS ==================== */
    .badge {
      display: inline-block;
      font-size: 0.58rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border-radius: 2px;
      padding: 0.1rem 0.35rem;
      vertical-align: middle;
      line-height: 1.4;
    }

    .badge-vegan {
      color: var(--color-matcha);
      border: 1px solid var(--color-matcha);
    }

    .badge-gf {
      color: #7a6a3a;
      border: 1px solid #c8a97e;
    }

    .badge-lf {
      color: #5a7a8a;
      border: 1px solid #9abac8;
    }

    /* ==================== EXTRAS ==================== */
    .extras-seccion {
      margin-top: 0.8rem;
      padding-top: 0.8rem;
      border-top: 1px dashed var(--color-borde);
    }

    .extras-titulo {
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--color-gris);
      margin-bottom: 0.4rem;
    }

    .extra-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.3rem 0;
      font-size: 0.8rem;
      color: var(--color-gris);
    }

    .extra-precio {
      font-family: var(--fuente-titulo);
      font-size: 0.85rem;
      color: var(--color-madera);
    }

    /* ==================== NOTA DE HIELO ==================== */
    .nota-hielo {
      font-size: 0.72rem;
      color: var(--color-gris);
      font-style: italic;
      text-align: center;
      margin-top: 0.5rem;
    }

    /* ==================== PIE DE PÁGINA ==================== */
    .menu-footer {
      text-align: center;
      padding: 2rem 0 1rem;
      font-size: 0.7rem;
      color: var(--color-gris);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      border-top: 1px solid var(--color-borde);
    }

    /* ==================== ESTADO DE CARGA / ERROR ==================== */
    #estado-carga {
      text-align: center;
      padding: 5rem 2rem;
      color: var(--color-gris);
      font-size: 0.8rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .error-aviso {
      background: white;
      border: 1px solid var(--color-borde);
      border-left: 3px solid #b94040;
      border-radius: 4px;
      padding: 1.2rem 1.5rem;
      font-size: 0.82rem;
      color: var(--color-gris);
      line-height: 1.7;
      max-width: 500px;
      margin: 0 auto;
      text-align: left;
      letter-spacing: 0;
      text-transform: none;
    }

    /* ==================== ANIMACIONES ==================== */
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeOut {
      from { opacity: 1; }
      to   { opacity: 0; pointer-events: none; }
    }

    /* ==================== RESPONSIVE (MÓVIL) ==================== */
    /*
      Media query: estos estilos solo aplican cuando
      la pantalla tiene 480px o menos (teléfonos pequeños)
    */
    @media (max-width: 480px) {
      .btn-cambiar-idioma {
        position: static;        /* Ya no está en esquina, fluye normal */
        display: block;
        margin: 0.5rem auto 0;
        text-align: center;
      }

      .menu-header {
        text-align: center;
      }

      .onigiri-precios {
        gap: 0.3rem;
      }

      .onigiri-precio-col {
        min-width: 44px;
      }
    }

    /* ==================== LOGO IMAGEN ==================== */
    .logo-img {
      display: block;
    }

    .logo-bienvenida {
      /* Tamaño responsivo en la pantalla de bienvenida */
      width: clamp(180px, 55vw, 320px);
      height: auto;
      margin: 0 auto;
    }

    .logo-menu {
      /* Tamaño más pequeño en el header del menú */
      width: clamp(140px, 40vw, 240px);
      height: auto;
      margin: 0 auto;
    }

    /* ==================== TEXTO ROTATIVO ==================== */
    /* Animación de fade para el cambio de idioma */
    @keyframes textFadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .pregunta-fade {
      animation: textFadeIn 0.4s ease both;
    }
  </style>
</head>

<body>

  <!--
    =====================================================
    SECCIÓN 1: PANTALLA DE SELECCIÓN DE IDIOMA
    Es lo primero que ve el cliente al abrir el menú.
    Los botones llaman a la función elegirIdioma(código)
    =====================================================
  -->

    <!--
      Contenedor donde JavaScript construye dinámicamente
      todas las secciones del menú leyendo los JSON reales.
    -->
    <div id="secciones-menu">
      <div id="estado-carga">Cargando menú…</div>
    </div>

    <footer class="menu-footer">
      <p id="footer-alergenos">Infórmanos sobre cualquier alergia alimentaria</p>
      <p style="margin-top:0.5rem; font-size:0.65rem; opacity:0.6;">(おちゃじかん) · 2026</p>
    </footer>

  </main><!-- fin #contenido-menu -->


  <script>
    /*
      =====================================================
      CONFIGURACIÓN
      =====================================================
    */
    const RUTA_TRANSLATES = 'translates/';

    /*
      =====================================================
      ESTADO GLOBAL
      datos = objeto JSON del idioma activo
      idiomaActual = código del idioma ('es', 'en', 'ja')
      =====================================================
    */
    let datos = null;
    let idiomaActual = 'es';

    /*
      =====================================================
      TEXTO ROTATIVO EN LA PANTALLA DE BIENVENIDA
      Cicla entre los 3 idiomas cada 2.5 s
      =====================================================
    */
    const preguntasIdiomas = [
      '¿En qué idioma prefieres tu menú?',
      'In which language would you like your menu?',
      'ご希望の言語でメニューをご覧ください'
    ];
    let indicePregunta = 0;
    let intervaloRotacion = null;

    function rotarPregunta() {
      const el = document.getElementById('pregunta-rotativa');
      if (!el) return;
      el.classList.remove('pregunta-fade');
      void el.offsetWidth; // Forzar reflow para reiniciar la animación
      indicePregunta = (indicePregunta + 1) % preguntasIdiomas.length;
      el.textContent = preguntasIdiomas[indicePregunta];
      el.classList.add('pregunta-fade');
    }
    intervaloRotacion = setInterval(rotarPregunta, 2500);


    /*
      =====================================================
      ELEGIR IDIOMA: carga el JSON correspondiente
      y renderiza el menú completo.
      =====================================================
    */
    function elegirIdioma(codigo) {
      clearInterval(intervaloRotacion); // Detener rotación
      idiomaActual = codigo;
      ocultarSelectorIdioma();
      mostrarMenu();
      cargarYRenderizar(codigo);
    }

    function ocultarSelectorIdioma() {
      const pantalla = document.getElementById('pantalla-idioma');
      pantalla.classList.add('oculto');
      setTimeout(() => { pantalla.style.display = 'none'; }, 500);
    }

    function mostrarMenu() {
      document.getElementById('contenido-menu').classList.add('visible');
    }

    function mostrarSelectorIdioma() {
      const pantalla = document.getElementById('pantalla-idioma');
      const menu = document.getElementById('contenido-menu');
      pantalla.style.display = 'flex';
      pantalla.classList.remove('oculto');
      menu.classList.remove('visible');
      // Reiniciar rotación
      intervaloRotacion = setInterval(rotarPregunta, 2500);
    }


    /*
      =====================================================
      CARGA DE DATOS DESDE JSON
      fetch() carga el archivo del idioma seleccionado.
      Requiere Live Server o hosting (no doble clic).
      =====================================================
    */
    async function cargarYRenderizar(codigo) {
      const contenedor = document.getElementById('secciones-menu');
      contenedor.innerHTML = '<div id="estado-carga">Cargando menú…</div>';

      try {
        const resp = await fetch(RUTA_TRANSLATES + codigo + '.json');
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        datos = await resp.json();
        document.documentElement.lang = codigo;
        actualizarUI();
        renderizarMenu();
      } catch (err) {
        contenedor.innerHTML = `
          <div class="error-aviso">
            <strong>Error al cargar el menú.</strong><br><br>
            Asegúrate de abrir este archivo con <strong>Live Server</strong> en VSCode
            (no con doble clic en el archivo).<br><br>
            Detalle técnico: ${err.message}
          </div>`;
      }
    }

    /*
      Actualiza los textos de la UI (subtítulo, botón cambiar idioma,
      footer) usando las claves del objeto ui del JSON.
    */
    function actualizarUI() {
      const ui = datos.ui;
      document.getElementById('menu-subtitulo').textContent = ui.subtitulo;
      document.getElementById('btn-cambiar-idioma').textContent = ui.cambiar_idioma;
      document.getElementById('footer-alergenos').textContent = ui.footer_alergenos;
    }


    /*
      =====================================================
      RENDERIZADO DEL MENÚ COMPLETO
      Se construye dinámicamente desde el JSON.
      El orden de secciones refleja el menú real del local.
      =====================================================
    */
    function renderizarMenu() {
      const contenedor = document.getElementById('secciones-menu');
      contenedor.innerHTML = '';

      const sec = datos.secciones;

      renderizarOnigiri(contenedor, sec.onigiri);
      renderizarPostres(contenedor, sec.postres);
      renderizarLattes(contenedor, sec.lattes);
      renderizarBowlSets(contenedor, sec.bowl_sets);
      renderizarInfusiones(contenedor, sec.infusiones);
    }


    /* ===== HELPERS ===== */

    /* Crea el div principal de una sección con título y descripción */
    function crearSeccion(titulo, descripcion) {
      const div = document.createElement('div');
      div.className = 'seccion-menu';

      const h2 = document.createElement('h2');
      h2.className = 'seccion-titulo';
      h2.textContent = titulo;
      div.appendChild(h2);

      if (descripcion) {
        const p = document.createElement('p');
        p.className = 'seccion-descripcion';
        p.textContent = descripcion;
        div.appendChild(p);
      }
      return div;
    }

    /* Genera los badges de restricción dietaria */
    function generarBadges(item) {
      const ui = datos.ui;
      let html = '';
      if (item.vegan)        html += `<span class="badge badge-vegan">${ui.badge_vegan}</span>`;
      if (item.gluten_free)  html += `<span class="badge badge-gf">${ui.badge_gf}</span>`;
      if (item.lactose_free) html += `<span class="badge badge-lf">${ui.badge_lf}</span>`;
      return html;
    }

    /* Genera la sección de extras (onigiri, lattes, etc.) */
    function crearExtras(extras, tituloExtras) {
      const div = document.createElement('div');
      div.className = 'extras-seccion';
      const tit = document.createElement('p');
      tit.className = 'extras-titulo';
      tit.textContent = tituloExtras;
      div.appendChild(tit);
      extras.forEach(extra => {
        const fila = document.createElement('div');
        fila.className = 'extra-item';
        fila.innerHTML = `<span>${extra.nombre}</span><span class="extra-precio">${extra.precio}</span>`;
        div.appendChild(fila);
      });
      return div;
    }


    /* ===== SECCIÓN: ONIGIRI ===== */
    function renderizarOnigiri(contenedor, secInfo) {
      const sec = crearSeccion(secInfo.titulo, secInfo.descripcion);
      const ui = datos.ui;
      const onigiri = datos.onigiri;

      /* Encabezado de columnas (White / Quinoa / Yaki) */
      const colsHeader = document.createElement('div');
      colsHeader.className = 'onigiri-cols-header';
      colsHeader.innerHTML = `
        <div style="flex:1;"></div>
        <span class="onigiri-col-label">${ui.rice_white}</span>
        <span class="onigiri-col-label">${ui.rice_quinoa}</span>
        <span class="onigiri-col-label">${ui.rice_yaki}</span>
      `;
      sec.appendChild(colsHeader);

      onigiri.rellenos.forEach(relleno => {
        const item = document.createElement('div');
        item.className = 'item-menu';

        const whiteVal  = relleno.precios.white  || null;
        const quinoaVal = relleno.precios.quinoa || null;
        const yakiVal   = relleno.precios.yaki   || null;

        item.innerHTML = `
          <div class="item-info">
            <div class="item-nombre">
              ${relleno.nombre}
              ${relleno.vegan ? `<span class="badge badge-vegan">${ui.badge_vegan}</span>` : ''}
            </div>
            ${relleno.descripcion ? `<div class="item-descripcion">${relleno.descripcion}</div>` : ''}
          </div>
          <div class="onigiri-precios">
            <div class="onigiri-precio-col">
              <span class="onigiri-precio-val ${whiteVal  ? '' : 'na'}">${whiteVal  || '—'}</span>
            </div>
            <div class="onigiri-precio-col">
              <span class="onigiri-precio-val ${quinoaVal ? '' : 'na'}">${quinoaVal || '—'}</span>
            </div>
            <div class="onigiri-precio-col">
              <span class="onigiri-precio-val ${yakiVal   ? '' : 'na'}">${yakiVal   || '—'}</span>
            </div>
          </div>
        `;
        sec.appendChild(item);
      });

      if (onigiri.extras && onigiri.extras.length) {
        sec.appendChild(crearExtras(onigiri.extras, ui.extra_titulo));
      }

      contenedor.appendChild(sec);
    }


    /* ===== SECCIÓN: POSTRES ===== */
    function renderizarPostres(contenedor, secInfo) {
      const sec = crearSeccion(secInfo.titulo, secInfo.descripcion);

      datos.postres.forEach(postre => {
        const item = document.createElement('div');
        item.className = 'item-menu';
        item.innerHTML = `
          <div class="item-info">
            <div class="item-nombre">
              ${postre.nombre}
              ${generarBadges(postre)}
            </div>
            ${postre.descripcion ? `<div class="item-descripcion">${postre.descripcion}</div>` : ''}
          </div>
          <div class="item-precio">${postre.precio}</div>
        `;
        sec.appendChild(item);
      });

      contenedor.appendChild(sec);
    }


    /* ===== SECCIÓN: LATTES ===== */
    function renderizarLattes(contenedor, secInfo) {
      const sec = crearSeccion(secInfo.titulo, null);
      const lattes = datos.lattes;

      /* --- Matcha --- */
      const subMatcha = document.createElement('div');
      subMatcha.className = 'subseccion-titulo';
      subMatcha.textContent = '✦ ' + secInfo.subtitulo_matcha;
      sec.appendChild(subMatcha);

      if (secInfo.desc_matcha) {
        const d = document.createElement('p');
        d.className = 'subseccion-desc';
        d.textContent = secInfo.desc_matcha;
        sec.appendChild(d);
      }

      lattes.matcha.forEach(latte => {
        sec.appendChild(crearFilaLatte(latte));
      });

      /* --- Hojicha --- */
      const subHojicha = document.createElement('div');
      subHojicha.className = 'subseccion-titulo';
      subHojicha.textContent = '✦ ' + secInfo.subtitulo_hojicha;
      sec.appendChild(subHojicha);

      if (secInfo.desc_hojicha) {
        const d = document.createElement('p');
        d.className = 'subseccion-desc';
        d.textContent = secInfo.desc_hojicha;
        sec.appendChild(d);
      }

      lattes.hojicha.forEach(latte => {
        sec.appendChild(crearFilaLatte(latte));
      });

      /* Extras de lattes (cubos de hielo) */
      if (lattes.extras && lattes.extras.length) {
        sec.appendChild(crearExtras(lattes.extras, datos.ui.extra_titulo));
      }

      contenedor.appendChild(sec);
    }

    /* Crea una fila de latte con sus precios hot/cold */
    function crearFilaLatte(latte) {
      const item = document.createElement('div');
      item.className = 'item-menu';
      const p = latte.precios;

      let preciosHTML = '<div class="latte-precios">';

      if (p.hot !== undefined && p.cold !== undefined) {
        preciosHTML += `
          <div class="latte-precio-fila">
            <span class="latte-precio-label">Hot</span>
            <span class="latte-precio-val">${p.hot}</span>
          </div>
          <div class="latte-precio-fila">
            <span class="latte-precio-label">Cold</span>
            <span class="latte-precio-val">${p.cold}</span>
          </div>`;
      } else {
        preciosHTML += `
          <div class="latte-precio-fila">
            <span class="latte-precio-label">Hot 8oz</span>
            <span class="latte-precio-val">${p.hot_8oz}</span>
          </div>
          <div class="latte-precio-fila">
            <span class="latte-precio-label">Cold 12oz</span>
            <span class="latte-precio-val">${p.cold_12oz}</span>
          </div>`;
      }
      preciosHTML += '</div>';

      item.innerHTML = `
        <div class="item-info">
          <div class="item-nombre">${latte.nombre}</div>
          ${latte.descripcion ? `<div class="item-descripcion">${latte.descripcion}</div>` : ''}
        </div>
        ${preciosHTML}
      `;
      return item;
    }


    /* ===== SECCIÓN: BOWL SETS ===== */
    function renderizarBowlSets(contenedor, secInfo) {
      const sec = crearSeccion(secInfo.titulo, secInfo.descripcion);

      datos.bowl_sets.forEach(bowl => {
        const item = document.createElement('div');
        item.className = 'bowl-item';

        const incluyeHTML = bowl.incluye
          ? bowl.incluye.map(i => `• ${i}`).join('<br>')
          : '';

        item.innerHTML = `
          <div class="bowl-header">
            <div class="item-nombre">${bowl.nombre}</div>
            <div class="item-precio">${bowl.precio}</div>
          </div>
          ${bowl.descripcion ? `<div class="item-descripcion">${bowl.descripcion}</div>` : ''}
          ${incluyeHTML ? `<div class="bowl-incluye">${incluyeHTML}</div>` : ''}
          ${bowl.nota ? `<div class="bowl-nota">✦ ${bowl.nota}</div>` : ''}
        `;
        sec.appendChild(item);
      });

      contenedor.appendChild(sec);
    }


    /* ===== SECCIÓN: INFUSIONES ===== */
    function renderizarInfusiones(contenedor, secInfo) {
      const sec = crearSeccion(secInfo.titulo, secInfo.descripcion);
      const infusiones = datos.infusiones;

      /* Tradicionales */
      const subTrad = document.createElement('div');
      subTrad.className = 'subseccion-titulo';
      subTrad.textContent = '✦ ' + secInfo.subtitulo_tradicionales;
      sec.appendChild(subTrad);

      if (secInfo.desc_tradicionales) {
        const d = document.createElement('p');
        d.className = 'subseccion-desc';
        d.textContent = secInfo.desc_tradicionales;
        sec.appendChild(d);
      }

      infusiones.tradicionales.forEach(inf => {
        sec.appendChild(crearFilaInfusion(inf));
      });

      /* Blends */
      const subBlend = document.createElement('div');
      subBlend.className = 'subseccion-titulo';
      subBlend.textContent = '✦ ' + secInfo.subtitulo_blends;
      sec.appendChild(subBlend);

      if (secInfo.desc_blends) {
        const d = document.createElement('p');
        d.className = 'subseccion-desc';
        d.textContent = secInfo.desc_blends;
        sec.appendChild(d);
      }

      infusiones.blends.forEach(inf => {
        sec.appendChild(crearFilaInfusion(inf));
      });

      /* Nota de hielo */
      const notaHielo = document.createElement('p');
      notaHielo.className = 'nota-hielo';
      notaHielo.textContent = datos.ui.nota_hielo;
      sec.appendChild(notaHielo);

      contenedor.appendChild(sec);
    }

    function crearFilaInfusion(inf) {
      const item = document.createElement('div');
      item.className = 'item-menu';
      item.innerHTML = `
        <div class="item-info">
          <div class="item-nombre">${inf.nombre}</div>
          ${inf.ingredientes ? `<div class="infusion-ingredientes">✦ ${inf.ingredientes}</div>` : ''}
          ${inf.descripcion ? `<div class="item-descripcion">${inf.descripcion}</div>` : ''}
        </div>
        <div class="item-precio">${inf.precio}</div>
      `;
      return item;
    }

  </script>

</body>
</html>
